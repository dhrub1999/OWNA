<!DOCTYPE html>
<html>
<head>

</head>
<body>
<x-dc>
<helmet>
<style>
:root {
  color-scheme: light;
  --ow-bg: #F7F6F2;
  --ow-surface: #FFFFFF;
  --ow-ink: #111111;
  --ow-muted: #6B6B67;
  --ow-line: #E4E2DC;
  --ow-line-soft: rgba(228,226,220,0.4);
  --ow-faint: #C6C3BB;
  --ow-header: rgba(247,246,242,0.72);
  --ow-accent: #0055FF;
  --ow-accent-soft: rgba(0,85,255,0.07);
  --ow-shadow: rgba(17,17,17,0.25);
  --ow-invert-bg: #111111;
  --ow-invert-ink: #F7F6F2;
  --ow-invert-muted: rgba(247,246,242,0.7);
  --ow-invert-faint: rgba(247,246,242,0.55);
}
html.dark {
  color-scheme: dark;
  --ow-bg: #0D0D0D;
  --ow-surface: #151515;
  --ow-ink: #F5F4EF;
  --ow-muted: #A5A49F;
  --ow-line: #292929;
  --ow-line-soft: rgba(41,41,41,0.55);
  --ow-faint: #454542;
  --ow-header: rgba(13,13,13,0.72);
  --ow-accent-soft: rgba(0,85,255,0.2);
  --ow-shadow: rgba(0,0,0,0.7);
  --ow-invert-bg: #F5F4EF;
  --ow-invert-ink: #111111;
  --ow-invert-muted: rgba(17,17,17,0.74);
  --ow-invert-faint: rgba(17,17,17,0.64);
}
@media (max-width: 760px) {
  [data-r="stage-side"] { flex-basis: 100%; max-height: 260px; border-right: 0; border-bottom: 1px solid var(--ow-line); }
  [data-r="stage-canvas"] { height: 380px; padding: 14px; }
  [data-r="stage-saved"] { display: none; }
}
</style>
</helmet>

  <div style="display: flex; min-height: 52px; flex-shrink: 0; flex-wrap: wrap; align-items: center; gap: 8px; border-bottom: 1px solid var(--ow-line, #E4E2DC); padding: 6px 12px;">

    </svg>

    <div role="radiogroup" aria-label="Preview size" style="margin-left: auto; margin-right: auto; display: flex; align-items: center; gap: 2px; border-radius: 8px; background: var(--ow-bg, #F7F6F2); padding: 2px;">
      <button type="button" onClick="{{ setDesktop }}" title="Desktop" aria-label="Desktop" style="display: flex; cursor: pointer; align-items: center; border: 0; border-radius: 6px; background: none; padding: 6px; color: var(--ow-muted, #6B6B67);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"></rect><line x1="8" x2="16" y1="21" y2="21"></line><line x1="12" x2="12" y1="17" y2="21"></line></svg>
      </button>
      <button type="button" onClick="{{ setMobile }}" title="Mobile" aria-label="Mobile" style="display: flex; cursor: pointer; align-items: center; border: 0; border-radius: 6px; background: none; padding: 6px; color: var(--ow-muted, #6B6B67);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"></rect><path d="M12 18h.01"></path></svg>
      </button>
    </div>

    <p data-r="stage-saved" role="status" style="display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 12px; white-space: nowrap; color: var(--ow-muted, #6B6B67);">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
      Saved
    </p>

    <span style="display: inline-flex; height: 32px; align-items: center; border-radius: 6px; background: #0055FF; padding: 0 14px; font-size: 13px; font-weight: 500; color: #FFFFFF;">Publish</span>
  </div>

  <div style="display: flex; flex-wrap: wrap; align-items: stretch;">

    <div data-r="stage-side" style="flex: 0 1 208px; max-height: 560px; display: flex; flex-direction: column; border-right: 1px solid var(--ow-line, #E4E2DC); overflow: auto;">
      <div style="border-bottom: 1px solid var(--ow-line, #E4E2DC); padding: 12px 0;">
        <p style="margin: 0 0 8px; padding: 0 16px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ow-muted, #6B6B67);">Your page</p>
        <sc-for list="{{ pageBlocks }}" as="row" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; font-size: 12px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="color: var(--ow-faint, #C6C3BB); flex-shrink: 0;" aria-hidden="true"><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg>
            <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ row.label }}</span>
            <sc-if value="{{ row.removable }}" hint-placeholder-val="{{ true }}">
              <button type="button" onClick="{{ row.remove }}" aria-label="Remove block" style="cursor: pointer; border: 0; background: none; padding: 2px; font-size: 13px; line-height: 1; color: var(--ow-muted, #6B6B67);">×</button>
            </sc-if>
            <sc-if value="{{ row.locked }}" hint-placeholder-val="{{ false }}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="11" height="11" style="color: var(--ow-faint, #C6C3BB); flex-shrink: 0; margin-right: 3px;" aria-label="The hero always stays"><title>The hero always stays</title><rect width="14" height="9" x="5" y="11" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <div style="display: flex; flex-direction: column; gap: 16px; padding: 16px;">
        <div>
          <p style="margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ow-muted, #6B6B67);">You</p>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;">
            <div style="display: flex; align-items: center; gap: 8px; border-radius: 6px; border: 1px solid var(--ow-line, #E4E2DC); padding: 8px; font-size: 12px; opacity: 0.5;" title="You already have a hero">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="color: var(--ow-muted, #6B6B67); flex-shrink: 0;" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg>
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Hero</span>
            </div>
          </div>
        </div>

        <div>
          <p style="margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ow-muted, #6B6B67);">Content</p>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;">
            <button type="button" onClick="{{ addText }}" title="A heading and a paragraph." style="display: flex; cursor: pointer; align-items: center; gap: 8px; border-radius: 6px; border: 1px solid var(--ow-line, #E4E2DC); background: var(--ow-surface, #FFFFFF); padding: 8px; font: inherit; font-size: 12px; text-align: left; color: var(--ow-ink, #111111);" style-hover="border-color: var(--ow-shadow, rgba(17,17,17,0.25)); background: rgba(247,246,242,0.6);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="color: var(--ow-muted, #6B6B67); flex-shrink: 0;" aria-hidden="true"><path d="M12 4v16"></path><path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2"></path><path d="M9 20h6"></path></svg>
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Text</span>
            </button>
            <button type="button" onClick="{{ addSocial }}" title="Icons for the platforms you're on." style="display: flex; cursor: pointer; align-items: center; gap: 8px; border-radius: 6px; border: 1px solid var(--ow-line, #E4E2DC); background: var(--ow-surface, #FFFFFF); padding: 8px; font: inherit; font-size: 12px; text-align: left; color: var(--ow-ink, #111111);" style-hover="border-color: var(--ow-shadow, rgba(17,17,17,0.25)); background: rgba(247,246,242,0.6);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="color: var(--ow-muted, #6B6B67); flex-shrink: 0;" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"></path></svg>
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Social links</span>
            </button>
            <button type="button" onClick="{{ addLinks }}" title="Buttons pointing anywhere you like." style="display: flex; cursor: pointer; align-items: center; gap: 8px; border-radius: 6px; border: 1px solid var(--ow-line, #E4E2DC); background: var(--ow-surface, #FFFFFF); padding: 8px; font: inherit; font-size: 12px; text-align: left; color: var(--ow-ink, #111111);" style-hover="border-color: var(--ow-shadow, rgba(17,17,17,0.25)); background: rgba(247,246,242,0.6);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="color: var(--ow-muted, #6B6B67); flex-shrink: 0;" aria-hidden="true"><path d="M9 17H7A5 5 0 0 1 7 7h2"></path><path d="M15 7h2a5 5 0 1 1 0 10h-2"></path><line x1="8" x2="16" y1="12" y2="12"></line></svg>
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Links</span>
            </button>
            <button type="button" onClick="{{ addProjects }}" title="Cards for the things you've made." style="display: flex; cursor: pointer; align-items: center; gap: 8px; border-radius: 6px; border: 1px solid var(--ow-line, #E4E2DC); background: var(--ow-surface, #FFFFFF); padding: 8px; font: inherit; font-size: 12px; text-align: left; color: var(--ow-ink, #111111);" style-hover="border-color: var(--ow-shadow, rgba(17,17,17,0.25)); background: rgba(247,246,242,0.6);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="color: var(--ow-muted, #6B6B67); flex-shrink: 0;" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg>
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Projects</span>
            </button>
          </div>
        </div>

        <div>
          <p style="margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ow-muted, #6B6B67);">Media</p>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;">
            <button type="button" onClick="{{ addImage }}" title="A single picture, optionally linked." style="display: flex; cursor: pointer; align-items: center; gap: 8px; border-radius: 6px; border: 1px solid var(--ow-line, #E4E2DC); background: var(--ow-surface, #FFFFFF); padding: 8px; font: inherit; font-size: 12px; text-align: left; color: var(--ow-ink, #111111);" style-hover="border-color: var(--ow-shadow, rgba(17,17,17,0.25)); background: rgba(247,246,242,0.6);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="color: var(--ow-muted, #6B6B67); flex-shrink: 0;" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Image</span>
            </button>
            <button type="button" onClick="{{ addGallery }}" title="A grid of images." style="display: flex; cursor: pointer; align-items: center; gap: 8px; border-radius: 6px; border: 1px solid var(--ow-line, #E4E2DC); background: var(--ow-surface, #FFFFFF); padding: 8px; font: inherit; font-size: 12px; text-align: left; color: var(--ow-ink, #111111);" style-hover="border-color: var(--ow-shadow, rgba(17,17,17,0.25)); background: rgba(247,246,242,0.6);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="color: var(--ow-muted, #6B6B67); flex-shrink: 0;" aria-hidden="true"><path d="m22 11-1.296-1.296a2.4 2.4 0 0 0-3.408 0L11 16"></path><path d="M4 8a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2"></path><circle cx="13" cy="7" r="1" fill="currentColor"></circle><rect x="8" y="2" width="14" height="14" rx="2"></rect></svg>
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Gallery</span>
            </button>
            <button type="button" onClick="{{ addEmbed }}" title="A Spotify or YouTube player." style="display: flex; cursor: pointer; align-items: center; gap: 8px; border-radius: 6px; border: 1px solid var(--ow-line, #E4E2DC); background: var(--ow-surface, #FFFFFF); padding: 8px; font: inherit; font-size: 12px; text-align: left; color: var(--ow-ink, #111111);" style-hover="border-color: var(--ow-shadow, rgba(17,17,17,0.25)); background: rgba(247,246,242,0.6);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="color: var(--ow-muted, #6B6B67); flex-shrink: 0;" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"></path></svg>
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Embed</span>
            </button>
          </div>
        </div>

        <div>
          <p style="margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ow-muted, #6B6B67);">Structure</p>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;">
            <button type="button" onClick="{{ addDivider }}" title="A line or a gap." style="display: flex; cursor: pointer; align-items: center; gap: 8px; border-radius: 6px; border: 1px solid var(--ow-line, #E4E2DC); background: var(--ow-surface, #FFFFFF); padding: 8px; font: inherit; font-size: 12px; text-align: left; color: var(--ow-ink, #111111);" style-hover="border-color: var(--ow-shadow, rgba(17,17,17,0.25)); background: rgba(247,246,242,0.6);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="color: var(--ow-muted, #6B6B67); flex-shrink: 0;" aria-hidden="true"><path d="M5 12h14"></path></svg>
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Divider</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div style="flex: 1 1 300px; display: flex; min-width: 0; min-height: 0; flex-direction: column;">
      <div ref="{{ viewportRef }}" data-r="stage-canvas" style="height: 460px; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; background: var(--ow-bg, #F7F6F2); padding: 20px; display: flex; align-items: flex-start; justify-content: center;">
        <div style="{{ canvasFrame }}">{{ canvas }}</div>
      </div>

      <div style="flex-shrink: 0; border-top: 1px solid var(--ow-line, #E4E2DC); padding: 12px 16px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px;">
          <p style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ow-muted, #6B6B67);">Theme</p>
          <p style="margin: 0; font-family: ui-monospace, monospace; font-size: 10px; color: var(--ow-muted, #6B6B67);">10 presets</p>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px;">{{ presets }}</div>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:620},&quot;persona&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;creative&quot;,&quot;photographer&quot;,&quot;freelancer&quot;,&quot;consultant&quot;,&quot;jewellery&quot;],&quot;default&quot;:&quot;creative&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;preset&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;minimal&quot;,&quot;dark&quot;,&quot;glass&quot;,&quot;retro&quot;,&quot;cyber&quot;,&quot;editorial&quot;,&quot;soft&quot;,&quot;colorful&quot;,&quot;professional&quot;,&quot;portfolio&quot;],&quot;default&quot;:&quot;glass&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;startBlocks&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;}}">
const STARTERS = {
  text: { heading: "About", body: "A couple of sentences about what you do and what you're into.", size: "base", tone: "default", align: "inherit" },
  social: { links: [{ id: "s1", platform: "instagram" }, { id: "s2", platform: "github" }], shape: "circle", size: "md", style: "icon", layout: "row" },
  links: { items: [{ id: "l1", label: "My portfolio", url: "example.com", description: "" }], style: "solid", size: "md", showArrow: true },
  projects: { heading: "Projects", items: [{ id: "p1", name: "Project name", description: "What it is, in one line.", imageUrl: "", tags: [] }], layout: "grid", columns: 2, imageRatio: "16:9", showTags: true, showDescription: true },
  image: { url: "https://picsum.photos/seed/owna-starter-image/1200/800", alt: "", caption: "", ratio: "16:9", fit: "cover", width: "full" },
  gallery: { heading: "Gallery", images: [
    { id: "g1", url: "https://picsum.photos/seed/owna-starter-a/700/700", alt: "", shape: "square" },
    { id: "g2", url: "https://picsum.photos/seed/owna-starter-b/700/700", alt: "", shape: "square" },
    { id: "g3", url: "https://picsum.photos/seed/owna-starter-c/700/700", alt: "", shape: "square" },
  ], layout: "grid", columns: 3, gap: 8, showCaptions: false },
  embed: { heading: "", url: "", title: "" },
  divider: { variant: "line", thickness: 1, height: 24, width: "full" },
};

const LABELS = {
  hero: "Hero", text: "Text", social: "Social links", links: "Links",
  projects: "Projects", image: "Image", gallery: "Gallery", embed: "Embed", divider: "Divider",
};

class Component extends DCLogic {
  state = { lib: null, order: null, preset: null, device: "desktop", seq: 0 };
  viewportRef = React.createRef();



  componentDidMount() {
    import("./owna-profiles.js").then((lib) => {
      const persona = this.props.persona || "creative";
      const demo = lib.demoProfiles[persona];
      const start = this.props.startBlocks || ["hero", "gallery"];
      this.setState({
        lib,
        order: start.map((type, i) => ({ key: `k${i}`, type })),
        preset: this.props.preset || demo.preset,
      });
    });
  }

  add(type) {
    this.setState((s) => ({ seq: s.seq + 1, order: [...(s.order || []), { key: `n${s.seq}`, type }] }));
    setTimeout(() => this.revealEnd(), 80);
  }

  // A new block lands at the bottom of the page, so the canvas follows it down
  // rather than leaving you looking at content that didn't change.
  revealEnd() {
    const el = this.viewportRef.current || document.querySelector('[data-r="stage-canvas"]');
    if (!el) return;
    requestAnimationFrame(() => {
      const from = el.scrollTop;
      const to = el.scrollHeight - el.clientHeight;
      if (to - from < 2) return;
      const start = performance.now();
      const step = (now) => {
        const t = Math.min(1, (now - start) / 340);
        el.scrollTop = from + (to - from) * (1 - Math.pow(1 - t, 3));
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }

  remove(key) {
    this.setState((s) => {
      const order = s.order || [];
      const row = order.find((b) => b.key === key);
      if (!row || row.type === "hero") return null;
      return { order: order.filter((b) => b.key !== key) };
    });
  }

  renderVals() {
    const { lib, order, preset, device } = this.state;
    const persona = this.props.persona || "creative";
    const width = device === "mobile" ? 390 : 620;

    const canvasFrame = {
      width: "100%",
      maxWidth: width,
      overflow: "hidden",
      borderRadius: 12,
      border: "1px solid var(--ow-line, #E4E2DC)",
      background: "var(--ow-surface, #FFFFFF)",
      boxShadow: "0 1px 2px rgba(17,17,17,0.05), 0 12px 30px -18px var(--ow-shadow, rgba(17,17,17,0.25))",
      transition: "max-width 260ms cubic-bezier(0.16,1,0.3,1)",
    };

    let canvas = null;
    let presets = [];

    if (lib && order) {
      const demo = lib.demoProfiles[persona];
      const byType = {};
      for (const b of demo.blocks) byType[b.type] = b;
      const theme = lib.PRESETS[preset];

      const blocks = order.map((row) => {
        const source = byType[row.type];
        return {
          id: row.key,
          type: row.type,
          props: source ? source.props : STARTERS[row.type] || {},
        };
      });

      canvas = lib.renderProfile(
        React,
        { profile: demo.profile, theme: theme.theme, layout: theme.layout, blocks },
        { contentWidth: width, sectionPadding: 36 },
      );

      presets = lib.PRESET_ORDER.map((id) => {
        const p = lib.PRESETS[id];
        const active = id === preset;
        return React.createElement("button", {
          key: id,
          type: "button",
          title: p.description,
          "aria-pressed": active,
          onClick: () => this.setState({ preset: id }),
          style: {
            display: "flex", alignItems: "center", gap: 6, cursor: "pointer",
            borderRadius: 8, padding: "5px 9px 5px 6px", font: "inherit", fontSize: 11,
            border: `1px solid ${active ? "#0055FF" : "var(--ow-line, #E4E2DC)"}`,
            background: active ? "var(--ow-accent-soft, rgba(0,85,255,0.08))" : "var(--ow-surface, #FFFFFF)",
            color: "var(--ow-ink, #111111)",
          },
        }, [
          React.createElement("span", {
            key: "sw",
            style: {
              display: "inline-flex", alignItems: "center", justifyContent: "center",
              width: 18, height: 18, borderRadius: 4,
              background: p.theme.colors.background,
              border: `1px solid ${p.theme.colors.border}`,
            },
          }, React.createElement("span", { style: { width: 7, height: 7, borderRadius: 999, background: p.theme.colors.accent } })),
          p.name,
        ]);
      });
    }

    return {
      canvas,
      canvasFrame,
      presets,
      viewportRef: this.viewportRef,
      pageBlocks: (order || []).map((row) => ({
        key: row.key,
        label: LABELS[row.type] || row.type,
        removable: row.type !== "hero",
        locked: row.type === "hero",
        remove: () => this.remove(row.key),
      })),
      addText: () => this.add("text"),
      addSocial: () => this.add("social"),
      addLinks: () => this.add("links"),
      addProjects: () => this.add("projects"),
      addImage: () => this.add("image"),
      addGallery: () => this.add("gallery"),
      addEmbed: () => this.add("embed"),
      addDivider: () => this.add("divider"),
      setDesktop: () => this.setState({ device: "desktop" }),
      setMobile: () => this.setState({ device: "mobile" }),
    };
  }
}
</script>
</body>
</html>
